<!doctype html>
<html lang="pt-BR" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fotos do Ambiente | Pastelaria do Bilu</title>
<meta name="description" content="Conheça a Pastelaria do Bilu: ambiente, balcão, a máquina de caldo de cana e os pastéis saindo quentinhos da fritura.">
<meta name="theme-color" content="#052D13">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../assets/img/favicon-192.png">
<link rel="preload" href="../assets/fonts/lilita-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="i-cardapio" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></symbol>
<symbol id="i-zap" viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.5z"/><path d="M9.3 8.8c-.3 3.3 2.6 6 5.8 5.9l1.1-1.4-2-1-.9.8a3.4 3.4 0 0 1-1.6-1.6l.8-.9-1-2z"/></symbol>
<symbol id="i-pino" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.5h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></symbol>
<symbol id="i-seta" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-voltar" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-prox" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-fechar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-insta" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17" cy="7" r=".7" fill="currentColor"/></symbol>
<symbol id="i-sacola" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
</defs></svg>

<header class="topo">
  <div class="toldo toldo-sm" aria-hidden="true"></div>
  <div class="wrap">
    <a class="voltar" href="../" aria-label="Voltar para o início"><svg class="ico" aria-hidden="true"><use href="#i-voltar"/></svg></a>
    <div class="topo-id">
      <img src="../assets/img/logo-circulo.webp" alt="" width="46" height="46">
      <h1>Fotos</h1>
    </div>
  </div>
</header>

<main class="fx">
  <div class="wrap">
    <p class="intro-texto">Conheça nosso espaço e veja um pouco do que acontece por aqui.</p>
    
    <div class="carrossel-secao">
      <div class="carrossel-header" style="color:var(--mata-fundo);width:100%;">
        <div class="carrossel-titulo" style="color:var(--mata-fundo);">
          <svg class="ico" aria-hidden="true"><use href="#i-camera"/></svg>
          <span>Ambiente & Preparo</span>
        </div>
        <span class="carrossel-contador" data-carrossel-contador style="background:var(--pastel);color:var(--mata-fundo);border-color:var(--mata-fundo);">1 / 5</span>
      </div>

      <div class="carrossel-viewport" data-carrossel-viewport>
        <div class="carrossel-track" data-carrossel-track>
          <!-- Slides gerados por carrossel.js -->
        </div>
      </div>

      <div class="carrossel-controles">
        <button class="carrossel-arrow" type="button" data-carrossel-ant aria-label="Foto anterior">
          <svg class="ico" aria-hidden="true"><use href="#i-voltar"/></svg>
        </button>
        <div class="carrossel-dots" data-carrossel-dots></div>
        <button class="carrossel-arrow" type="button" data-carrossel-prox aria-label="Próxima foto">
          <svg class="ico" aria-hidden="true"><use href="#i-prox"/></svg>
        </button>
      </div>

      <div class="carrossel-dica" style="color:var(--mata-fundo);">
        <svg class="ico" aria-hidden="true"><use href="#i-seta"/></svg>
        <span>Arraste para o lado para ver mais fotos</span>
      </div>
    </div>

    <a class="btn btn-cheio" href="../cardapio/">
      <svg class="ico" aria-hidden="true"><use href="#i-cardapio"/></svg>
      <span>Ver cardápio</span>
    </a>
  </div>
</main>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/carrossel.js"></script>
</body>
</html>
