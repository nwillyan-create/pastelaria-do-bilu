<!doctype html>
<html lang="pt-BR" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cardápio | Pastelaria do Bilu</title>
<meta name="description" content="Cardápio da Pastelaria do Bilu: pastéis, açaí, caldo de cana, sucos e bebidas. Escolha os itens e envie seu pedido pelo WhatsApp.">
<meta name="theme-color" content="#052D13">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../assets/img/favicon-192.png">
<link rel="preload" href="../assets/fonts/lilita-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="i-cardapio" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></symbol>
<symbol id="i-zap" viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.5z"/><path d="M9.3 8.8c-.3 3.3 2.6 6 5.8 5.9l1.1-1.4-2-1-.9.8a3.4 3.4 0 0 1-1.6-1.6l.8-.9-1-2z"/></symbol>
<symbol id="i-pino" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.5h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></symbol>
<symbol id="i-seta" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-voltar" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-prox" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-fechar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-insta" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17" cy="7" r=".7" fill="currentColor"/></symbol>
<symbol id="i-sacola" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
</defs></svg>

<header class="topo">
  <div class="toldo toldo-sm" aria-hidden="true"></div>
  <div class="wrap">
    <a class="voltar" href="../" aria-label="Voltar para o início"><svg class="ico" aria-hidden="true"><use href="#i-voltar"/></svg></a>
    <div class="topo-id">
      <img src="../assets/img/logo-circulo.webp" alt="" width="46" height="46">
      <h1>Cardápio</h1>
    </div>
  </div>
</header>

<nav class="cats" aria-label="Categorias do cardápio"><div class="cats-in"></div></nav>

<main class="cx">
  <div class="wrap">
    <p class="status status-cx" data-status role="status"><i aria-hidden="true"></i><span></span></p>
    <div data-cardapio></div>
  </div>
</main>

<div class="carrinho-barra" aria-hidden="true">
  <button class="carrinho-abrir" type="button" tabindex="-1">
    <span class="qtd">0</span>
    <span class="rot">Ver meu pedido</span>
    <span class="tot">R$ 0,00</span>
  </button>
</div>

<div class="fundo-gaveta"></div>
<aside class="gaveta" role="dialog" aria-modal="true" aria-labelledby="g-titulo" aria-hidden="true">
  <div class="gaveta-topo">
    <button class="alca" type="button" aria-label="Fechar pedido"></button>
    <h2 class="faixa" id="g-titulo">Seu pedido</h2>
    <button class="fechar" type="button" aria-label="Fechar"><svg class="ico" aria-hidden="true"><use href="#i-fechar"/></svg></button>
  </div>
  <p class="gaveta-vazia">Seu carrinho está vazio. Adicione itens do cardápio.</p>
  <ul class="gaveta-lista" hidden></ul>
  <div class="gaveta-rodape" hidden>
    <label class="obs" for="obs">Alguma observação?
      <textarea id="obs" rows="2" maxlength="240" placeholder="Ex.: sem cebola, troco para R$ 50"></textarea>
    </label>
    <p class="total"><span>Total</span><strong data-total>R$ 0,00</strong></p>
    <a class="btn btn-cheio" id="enviar" target="_blank" rel="noopener">
      <svg class="ico" aria-hidden="true"><use href="#i-zap"/></svg>
      <span>Enviar pedido no WhatsApp</span>
    </a>
    <p class="nota">A gente confirma o valor final e como você vai receber direto no WhatsApp.</p>
    <button class="limpar" type="button">Esvaziar carrinho</button>
  </div>
</aside>
<p class="sr" id="anuncio" aria-live="polite"></p>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/menu-data.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/cart.js"></script>
</body>
</html>
